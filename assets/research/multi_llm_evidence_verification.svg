<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-label="Sanitized multi-LLM evidence verification schematic">
  <defs>
    <style>
      .bg{fill:#f7f9fb}
      .box{fill:#fff;stroke:#cfd7df;stroke-width:2;rx:10}
      .llm{fill:#eef6f2;stroke:#4f8a73;stroke-width:2;rx:10}
      .warn{fill:#fff8e8;stroke:#bd8b2f;stroke-width:2;rx:10}
      .final{fill:#edf3f8;stroke:#315f72;stroke-width:3;rx:10}
      .text{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;fill:#17212b}
      .small{font-size:17px;fill:#526170}
      .tiny{font-size:15px;fill:#607080}
      .title{font-size:28px;font-weight:700;fill:#17212b}
      .arrow{stroke:#6b7785;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:7 7}
      .chip{fill:#f2f5f7;stroke:#d7dee6;stroke-width:1.5;rx:14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7785"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="620"/>
  <text class="title" x="52" y="58">Sanitized Example: Multi-LLM Semantic Measurement With Evidence Verification</text>
  <text class="small" x="52" y="88">Synthetic passage and labels. The figure shows the public workflow boundary, not production prompts or private corpus text.</text>

  <rect class="box" x="52" y="128" width="260" height="128"/>
  <text class="text" x="78" y="166">Policy document</text>
  <text class="small" x="78" y="198">Long source text</text>
  <text class="tiny" x="78" y="226">stable doc_id</text>

  <rect class="box" x="402" y="110" width="330" height="164"/>
  <text class="text" x="430" y="150">Retrieved passage</text>
  <text class="small" x="430" y="182">chunk_id: SYN-PLAN-001-C012</text>
  <text class="tiny" x="430" y="214">"... robotics testing lab,</text>
  <text class="tiny" x="430" y="238">procurement channel, grants ..."</text>

  <path class="arrow" d="M312 192 C348 192 360 192 402 192"/>

  <rect class="llm" x="72" y="334" width="250" height="78"/>
  <text class="text" x="98" y="366">LLM A</text>
  <text class="small" x="98" y="394">manufacturing + finance</text>

  <rect class="llm" x="372" y="334" width="250" height="78"/>
  <text class="text" x="398" y="366">LLM B</text>
  <text class="small" x="398" y="394">manufacturing + finance</text>

  <rect class="warn" x="672" y="334" width="250" height="78"/>
  <text class="text" x="698" y="366">LLM C</text>
  <text class="small" x="698" y="394">manufacturing + market access</text>

  <path class="arrow dashed" d="M500 274 C440 306 330 320 210 334"/>
  <path class="arrow dashed" d="M560 274 C548 305 525 320 498 334"/>
  <path class="arrow dashed" d="M630 274 C675 304 720 320 790 334"/>

  <rect class="box" x="202" y="474" width="290" height="88"/>
  <text class="text" x="228" y="510">Normalize labels</text>
  <text class="small" x="228" y="538">map synonyms to controlled schema</text>

  <rect class="box" x="552" y="474" width="260" height="88"/>
  <text class="text" x="578" y="510">Aggregate votes</text>
  <text class="small" x="578" y="538">agreement, confidence, review flag</text>

  <rect class="final" x="872" y="462" width="254" height="112"/>
  <text class="text" x="898" y="500">Verified output</text>
  <text class="small" x="898" y="530">industry: manufacturing</text>
  <text class="small" x="898" y="556">evidence: chunk_id attached</text>

  <path class="arrow" d="M322 374 C355 434 382 444 347 474"/>
  <path class="arrow" d="M498 412 C498 446 498 462 492 500"/>
  <path class="arrow" d="M790 412 C754 442 720 456 682 474"/>
  <path class="arrow" d="M492 518 L552 518"/>
  <path class="arrow" d="M812 518 L872 518"/>
  <path class="arrow dashed" d="M732 192 C920 212 1010 300 1000 462"/>

  <rect class="chip" x="872" y="128" width="254" height="90"/>
  <text class="small" x="898" y="164">Evidence check</text>
  <text class="tiny" x="898" y="192">claim must cite retrieved chunk</text>
</svg>
